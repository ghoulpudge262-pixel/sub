<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 MyVPN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    min-height: 100vh; background: #0a0a0f; color: #fff;
    overflow-x: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 50, 255, 0.3), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255, 50, 150, 0.25), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(50, 200, 255, 0.2), transparent 60%);
    z-index: -1; animation: bgMove 15s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.2) rotate(10deg); }
  }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  .header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.8s ease; }
  .logo {
    font-size: 48px; font-weight: 800;
    background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px; letter-spacing: -1px;
  }
  .subtitle { color: #94a3b8; font-size: 16px; font-weight: 500; }
  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px; padding: 30px; margin-bottom: 24px;
    animation: fadeInUp 0.8s ease; transition: all 0.3s ease;
  }
  .card:hover { border-color: rgba(168, 85, 247, 0.3); transform: translateY(-2px); }
  .user-card { display: flex; align-items: center; gap: 20px; }
  .avatar {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; flex-shrink: 0;
  }
  .user-info h2 { font-size: 22px; margin-bottom: 4px; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-premium { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #422006; }
  .badge-free { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stat {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;
  }
  .stat:hover { background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.3); }
  .stat-value {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
  }
  .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .progress { margin-top: 20px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #cbd5e1; }
  .progress-bar { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #a855f7, #ec4899);
    border-radius: 10px; transition: width 1s ease;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
  }
  .sub-url {
    display: flex; gap: 10px; background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
    padding: 12px; margin-top: 16px;
  }
  .sub-url input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-family: 'SF Mono', Consolas, monospace; font-size: 13px; outline: none;
  }
  .btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
  .btn-primary {
    background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff;
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6); }
  .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .server {
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px;
    transition: all 0.3s ease; cursor: pointer;
  }
  .server:hover { background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.4); transform: translateY(-3px); }
  .server-flag { font-size: 32px; }
  .server-name { font-weight: 600; font-size: 14px; }
  .server-city { font-size: 12px; color: #94a3b8; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .app {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; padding: 16px; text-align: center; text-decoration: none; color: #fff; transition: all 0.3s ease;
  }
  .app:hover { background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.4); transform: translateY(-2px); }
  .app-icon { font-size: 32px; margin-bottom: 8px; }
  .app-name { font-weight: 600; font-size: 14px; }
  .app-platform { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #10b981, #059669); color: #fff;
    padding: 14px 24px; border-radius: 12px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    transition: transform 0.3s ease; z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 600px) {
    .logo { font-size: 36px; }
    .stats { grid-template-columns: 1fr; }
    .user-card { flex-direction: column; text-align: center; }
    .sub-url { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="logo">🚀 MyVPN</h1>
    <p class="subtitle">Премиум VPN для свободного интернета</p>
  </div>
  <div class="card user-card">
    <div class="avatar" id="avatar">U</div>
    <div class="user-info">
      <h2 id="userName">Загрузка...</h2>
      <span class="badge badge-premium" id="userPlan">Premium</span>
    </div>
  </div>
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-value" id="daysLeft">—</div><div class="stat-label">Дней осталось</div></div>
      <div class="stat"><div class="stat-value" id="gbUsed">—</div><div class="stat-label">GB использовано</div></div>
      <div class="stat"><div class="stat-value" id="gbTotal">—</div><div class="stat-label">GB всего</div></div>
    </div>
    <div class="progress">
      <div class="progress-header"><span>Использование трафика</span><span id="percentText">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    </div>
    <div class="sub-url">
      <input type="text" id="subUrl" readonly value="">
      <button class="btn btn-primary" onclick="copyUrl()">📋 Копировать</button>
    </div>
  </div>
  <div class="card">
    <h3 class="section-title">🌍 Доступные серверы</h3>
    <div class="servers-grid" id="serversGrid"><div style="color:#94a3b8">Загрузка...</div></div>
  </div>
  <div class="card">
    <h3 class="section-title">📱 Скачать приложение</h3>
    <div class="apps">
      <a href="https://apps.apple.com/app/streisand/id6450534064" class="app" target="_blank">
        <div class="app-icon">🍎</div><div class="app-name">Streisand</div><div class="app-platform">iOS</div>
      </a>
      <a href="https://play.google.com/store/apps/details?id=app.hiddify.com" class="app" target="_blank">
        <div class="app-icon">🤖</div><div class="app-name">Hiddify</div><div class="app-platform">Android</div>
      </a>
      <a href="https://github.com/hiddify/hiddify-next/releases" class="app" target="_blank">
        <div class="app-icon">🪟</div><div class="app-name">Hiddify</div><div class="app-platform">Windows</div>
      </a>
      <a href="https://github.com/hiddify/hiddify-next/releases" class="app" target="_blank">
        <div class="app-icon">🍏</div><div class="app-name">Hiddify</div><div class="app-platform">macOS</div>
      </a>
    </div>
  </div>
</div>
<div class="toast" id="toast">✅ Ссылка скопирована!</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id') || 'demo-user-123';
  const subUrl = `${window.location.origin}/sub/${userId}`;
  document.getElementById('subUrl').value = subUrl;
  async function loadStats() {
    try {
      const res = await fetch(`/stats/${userId}`);
      if (!res.ok) throw new Error('User not found');
      const data = await res.json();
      document.getElementById('userName').textContent = data.name;
      document.getElementById('avatar').textContent = data.name[0].toUpperCase();
      document.getElementById('daysLeft').textContent = data.daysLeft;
      document.getElementById('gbUsed').textContent = data.gbUsed;
      document.getElementById('gbTotal').textContent = data.gbTotal;
      document.getElementById('percentText').textContent = data.percent + '%';
      const planEl = document.getElementById('userPlan');
      planEl.textContent = data.plan === 'premium' ? '⚡ Premium' : '🆓 Free';
      planEl.className = 'badge ' + (data.plan === 'premium' ? 'badge-premium' : 'badge-free');
      setTimeout(() => { document.getElementById('progressFill').style.width = data.percent + '%'; }, 300);
      const grid = document.getElementById('serversGrid');
      grid.innerHTML = data.servers.map(s => `
        <div class="server">
          <div class="server-flag">${s.flag}</div>
          <div><div class="server-name">${s.country}</div><div class="server-city">${s.city}</div></div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('userName').textContent = 'Пользователь не найден';
    }
  }
  function copyUrl() {
    navigator.clipboard.writeText(document.getElementById('subUrl').value);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }
  loadStats();
</script>
</body>
</html>
